# Local dev: Postgres 16 (with pgvector compiled in), a one-shot migrate
# service, then the API. The worker service joins in Phase 3.
#
# ${VAR:-default} values make `docker compose up` work from a clean clone with
# no .env; compose reads .env automatically when present and it wins. The dev
# defaults are not secrets. The api/migrate containers get DATABASE_URL
# pointing at the "postgres" service name; DATABASE_URL in .env points at
# localhost and is for host-side tools.

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Parallel HNSW builds allocate the whole maintenance_work_mem as ONE
    # POSIX shared memory segment up front (pgvector v0.8.5 hnswbuild.c:
    # esthnswarea = maintenance_work_mem * 1024, shared by all workers).
    # Containers default /dev/shm to 64MB, which kills the build at CREATE
    # INDEX time with "could not resize shared memory segment" — found by a
    # 30K probe build, 2026-07-31. 2g is a cap on virtual space, not a
    # reservation; only touched pages consume VM memory.
    shm_size: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sieve}
      POSTGRES_DB: ${POSTGRES_DB:-sieve}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP probe. During first-run initdb the image
      # boots a temporary server that answers only on the unix socket; a
      # socket probe reports "healthy" before the real server listens on TCP,
      # and dependents then connect into the void.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-sieve} -d ${POSTGRES_DB:-sieve}"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: applies pending migrations and exits. Keeping DDL out of the
  # API process, but inside `docker compose up`, means a fresh clone reaches
  # a migrated database with one command and no undocumented manual step.
  migrate:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sieve}:${POSTGRES_PASSWORD:-sieve}@postgres:5432/${POSTGRES_DB:-sieve}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    command: python -m api.db.migrate
    volumes:
      - ./api:/app/api
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sieve}:${POSTGRES_PASSWORD:-sieve}@postgres:5432/${POSTGRES_DB:-sieve}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      # Vector mode embeds queries at request time (DECISION-2b). The model
      # dir is gitignored; without it, bm25 works and vector mode fails
      # loudly on first use.
      EMBED_MODEL_DIR: /models
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount only the source, not the whole repo, so the image's installed
      # site-packages stay authoritative for dependencies.
      - ./api:/app/api
      - ./models/bge-small-en-v1.5:/models:ro
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      # The API starts only after migrations have applied cleanly, which
      # transitively waits for the pg_isready gate on postgres.
      migrate:
        condition: service_completed_successfully

  # The independent check: `make test` (or `docker compose run --rm test`)
  # runs the pytest suite in a container built from the dev target — no host
  # Python, no trusting reported test counts. profiles: keeps it out of a
  # plain `docker compose up`; `run` enables the profile implicitly.
  test:
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sieve}:${POSTGRES_PASSWORD:-sieve}@postgres:5432/${POSTGRES_DB:-sieve}
      # scratch_db issues DROP DATABASE and refuses non-local hosts; this
      # names the one non-local host that is still ours — the compose
      # network's database service. See tests/conftest.py.
      SIEVE_TESTS_ALLOW_DB_HOST: postgres
    volumes:
      # Current source, tests, and bench, same pattern as the api service —
      # the image only needs rebuilding when dependencies change.
      - ./api:/app/api
      - ./tests:/app/tests
      - ./bench:/app/bench
    depends_on:
      postgres:
        condition: service_healthy

  # DECISION-1d: the frontend toolchain lives in Docker too — no host Node.
  # Stock node image + bind-mounted source instead of a Dockerfile: the dev
  # "image" is just node_modules, which npm install materializes into a named
  # volume (below) on first up. Vite serves with HMR; file watching is
  # polling-based because inotify doesn't cross the VM bind mount (see
  # web/vite.config.ts).
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && exec npm run dev"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      # Named volume shadows /app/node_modules: installs stay VM-local (a
      # bind-mounted node_modules is punishingly slow through virtiofs) and
      # Linux-native binaries never land on the macOS host.
      - web_node_modules:/app/node_modules
    depends_on:
      # Started, not healthy: Vite only proxies /api per request, so it can
      # boot in parallel with the API instead of serializing compose up.
      api:
        condition: service_started

volumes:
  pgdata:
  web_node_modules:
