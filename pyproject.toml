[project]
name = "sieve"
version = "0.1.0"
description = "Literature search and triage: hybrid keyword + semantic retrieval over academic papers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    # Runtime dep since the OpenAlex client; was dev-only for the test client.
    "httpx>=0.27",
    # The embedding path (DECISION-2b/2d): bge-small-en-v1.5 runs on ONNX
    # Runtime CPU; tokenizers is the model's own WordPiece implementation.
    # Runtime deps, not dev: the query path embeds at request time in Phase 2.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    # Lint tools are pinned exactly: new ruff rules or stricter mypy releases
    # otherwise turn CI red on unchanged commits, and CI would drift from the
    # local .venv. Bump deliberately, in a commit that says so.
    "ruff==0.16.0",
    "mypy==2.3.0",
    # bench/ plots committed to the repo (recall/latency tradeoff curves).
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.setuptools.package-data]
# Without this the wheel ships api.db with no migrations/ at all, and the
# runner would report success against a database it never touched.
"api.db" = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

# onnxruntime ships no type stubs; everything else stays strict.
[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import bench/ (the measurement harness
# is tested like everything else); api/ comes from the editable install.
pythonpath = ["."]
