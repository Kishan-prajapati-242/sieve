[project]
name = "sieve"
version = "0.1.0"
description = "Literature search and triage: hybrid keyword + semantic retrieval over academic papers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    # Lint tools are pinned exactly: new ruff rules or stricter mypy releases
    # otherwise turn CI red on unchanged commits, and CI would drift from the
    # local .venv. Bump deliberately, in a commit that says so.
    "ruff==0.16.0",
    "mypy==2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.setuptools.package-data]
# Without this the wheel ships api.db with no migrations/ at all, and the
# runner would report success against a database it never touched.
"api.db" = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
